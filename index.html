<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino LA | Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #050810; color: white; font-family: 'Segoe UI', sans-serif; }
        .gold-text { background: linear-gradient(to bottom, #cf9f2d, #fff9aa, #aa771c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .btn-main { background: linear-gradient(180deg, #cf9f2d 0%, #7a5a0f 100%); color: black; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-10">

    <header class="w-full max-w-md p-8 text-center">
        <div class="border-2 border-yellow-600 rounded-full w-24 h-24 flex items-center justify-center mx-auto mb-4">
            <span class="text-4xl font-black gold-text">LA</span>
        </div>
        <h1 class="text-3xl font-bold tracking-tighter uppercase italic">Casino LA</h1>
        <p class="text-[10px] text-gray-500 tracking-[0.4em] uppercase mt-2 font-bold">Apuestas Libres • Cajeros 24/7</p>
        <p class="text-xs mt-3 text-yellow-600/70 font-semibold uppercase">Gestión: Lucila Agustina</p>
        <div class="flex justify-center gap-4 mt-4 text-[9px] font-bold text-gray-600 uppercase">
            <span>BT364</span> <span>•</span> <span>BETSON</span>
        </div>
    </header>

    <main class="w-full max-w-md px-6 space-y-6">
        
        <div class="glass-card p-8 text-center shadow-2xl border-t-2 border-yellow-600/20">
            <p class="text-gray-400 text-xs uppercase tracking-widest mb-2">Créditos de Jugador</p>
            <h2 class="text-5xl font-mono font-bold gold-text" id="userBalance">0.00</h2>
        </div>

        <div id="sectionJugar" class="glass-card p-6">
            <div class="flex items-center gap-4 mb-4">
                <span class="text-3xl">🎲</span>
                <h3 class="font-bold text-lg uppercase tracking-wider text-yellow-500">Dados Royal</h3>
            </div>
            <input type="number" id="inputApuesta" placeholder="¿Cuánto apuestas?" class="w-full bg-black/40 border border-white/10 p-4 rounded-lg mb-4 text-yellow-500 text-center font-bold">
            <button onclick="jugar()" class="w-full btn-main py-4 rounded-xl active:scale-95 transition text-lg shadow-lg">Girar y Apostar</button>
            <p id="msgJuego" class="text-center mt-4 text-sm font-bold uppercase italic h-4"></p>
        </div>

        <div id="sectionAdmin" class="hidden glass-card p-6 border-l-4 border-green-600">
            <h3 class="font-bold text-green-500 mb-4 uppercase text-sm">Portal de Cajero</h3>
            <input type="number" id="montoCarga" placeholder="Fichas a acreditar" class="w-full bg-black/40 border border-white/10 p-3 rounded-lg mb-4 text-green-400 font-bold">
            <button onclick="cargar()" class="w-full bg-green-700 hover:bg-green-600 text-white font-bold py-3 rounded-xl uppercase text-xs">Cargar Saldo Oficial</button>
        </div>

        <nav class="flex gap-4">
            <button onclick="pestaña('jugar')" class="flex-1 glass-card py-3 text-[10px] font-bold uppercase text-gray-400 hover:text-white transition">Casino</button>
            <button onclick="pestaña('admin')" class="flex-1 glass-card py-3 text-[10px] font-bold uppercase text-gray-400 hover:text-white transition">Cajero</button>
        </nav>

    </main>

    <script>
        let saldo = parseFloat(localStorage.getItem('casino_la_bal')) || 0;
        const disp = document.getElementById('userBalance');
        disp.innerText = saldo.toFixed(2);

        function pestaña(t) {
            document.getElementById('sectionJugar').classList.toggle('hidden', t !== 'jugar');
            document.getElementById('sectionAdmin').classList.toggle('hidden', t !== 'admin');
        }

        function cargar() {
            const m = parseFloat(document.getElementById('montoCarga').value);
            if(m > 0) {
                saldo += m;
                actualizar();
                document.getElementById('montoCarga').value = '';
                alert("CARGA EXITOSA POR LUCILA AGUSTINA");
            }
        }

        function jugar() {
            const a = parseFloat(document.getElementById('inputApuesta').value);
            const msg = document.getElementById('msgJuego');
            if(isNaN(a) || a <= 0 || a > saldo) {
                msg.innerText = "Saldo insuficiente";
                msg.className = "text-center mt-4 text-sm font-bold text-red-500";
                return;
            }
            const win = Math.random() > 0.55; // Ventaja casa
            if(win) {
                saldo += a;
                msg.innerText = "¡GANASTE!";
                msg.className = "text-center mt-4 text-sm font-bold text-green-500";
            } else {
                saldo -= a;
                msg.innerText = "CASA GANA";
                msg.className = "text-center mt-4 text-sm font-bold text-red-400";
            }
            actualizar();
        }

        function actualizar() {
            disp.innerText = saldo.toFixed(2);
            localStorage.setItem('casino_la_bal', saldo);
        }
    </script>
</body>
</html>
