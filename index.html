<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino LA - Portal Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --dark-bg: #0b0f1a; --card-bg: #161d2f; }
        body { background-color: var(--dark-bg); color: white; font-family: sans-serif; margin: 0; }
        .gold-gradient { background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .panel-glass { background: rgba(22, 29, 47, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .btn-gold { background: linear-gradient(180deg, #d4af37 0%, #8a6d3b 100%); color: black; font-weight: bold; }
    </style>
</head>
<body class="pb-20">

    <header class="p-6 text-center border-b border-yellow-900/30 bg-slate-900/50">
        <div class="inline-block p-4 border-2 border-yellow-600 rounded-full mb-2">
            <h1 class="text-4xl font-black tracking-tighter">CASINO <span class="gold-gradient">LA</span></h1>
        </div>
        <p class="text-xs tracking-[0.3em] uppercase text-gray-400">Apuestas Libres • Cajeros 24/7</p>
        <p class="text-[10px] text-yellow-700 mt-1 uppercase font-bold">Lucila Agustina • Gestión Oficial</p>
    </header>

    <div class="bg-black/40 py-2 flex justify-center gap-6 text-[10px] text-gray-500 uppercase font-bold tracking-widest">
        <span>Provider: BT364</span>
        <span class="text-yellow-900">|</span>
        <span>Partner: BETSON</span>
    </div>

    <div class="max-w-md mx-auto mt-6 px-4">
        <div class="panel-glass p-6 rounded-3xl text-center shadow-2xl">
            <p class="text-gray-400 text-sm mb-1">Créditos Disponibles</p>
            <h2 class="text-5xl font-mono font-bold text-yellow-500" id="displayBalance">0.00</h2>
        </div>
    </div>

    <div class="flex justify-center gap-4 mt-8 px-4 max-w-md mx-auto">
        <button onclick="showTab('juegos')" id="btnJuegos" class="flex-1 py-3 rounded-xl btn-gold">JUGAR</button>
        <button onclick="showTab('admin')" id="btnAdmin" class="flex-1 py-3 rounded-xl bg-slate-800 border border-slate-700">ADMIN</button>
    </div>

    <section id="tabJuegos" class="max-w-md mx-auto mt-8 px-4">
        <div class="panel-glass p-4 rounded-2xl flex items-center gap-4">
            <div class="text-4xl">🎲</div>
            <div class="flex-1">
                <h3 class="font-bold">DADOS ROYAL</h3>
                <input type="number" id="betDice" placeholder="Apuesta" class="w-full bg-black/50 border border-slate-700 rounded p-2 mt-2 text-yellow-500">
                <button onclick="playDice()" class="w-full bg-yellow-600 mt-2 py-2 rounded font-bold">APOSTAR</button>
            </div>
        </div>
        <p id="gameMsg" class="text-center mt-4 font-bold"></p>
    </section>

    <section id="tabAdmin" class="hidden max-w-md mx-auto mt-8 px-4">
        <div class="panel-glass p-6 rounded-2xl border-l-4 border-yellow-500">
            <h3 class="text-xl font-bold mb-4">Panel de Cajero</h3>
            <input type="number" id="loadAmount" class="w-full bg-black/50 border border-slate-700 p-3 rounded-lg" placeholder="Monto a cargar">
            <button onclick="adminLoad()" class="w-full bg-green-700 mt-4 py-3 rounded-lg font-bold">CARGAR FICHAS</button>
        </div>
    </section>

    <script>
        let balance = parseFloat(localStorage.getItem('casino_la_bal')) || 0;
        function updateDisplay() {
            document.getElementById('displayBalance').innerText = balance.toFixed(2);
            localStorage.setItem('casino_la_bal', balance);
        }
        function showTab(tab) {
            document.getElementById('tabJuegos').classList.toggle('hidden', tab !== 'juegos');
            document.getElementById('tabAdmin').classList.toggle('hidden', tab !== 'admin');
        }
        function adminLoad() {
            const amount = parseFloat(document.getElementById('loadAmount').value);
            if(amount > 0) { balance += amount; updateDisplay(); alert("Carga Exitosa"); }
        }
        function playDice() {
            const bet = parseFloat(document.getElementById('betDice').value);
            if(bet > 0 && bet <= balance) {
                const win = Math.random() > 0.5;
                balance = win ? balance + bet : balance - bet;
                document.getElementById('gameMsg').innerText = win ? "¡GANASTE!" : "PERDISTE";
                document.getElementById('gameMsg').className = win ? "text-green-500 text-center mt-4 font-bold" : "text-red-500 text-center mt-4 font-bold";
                updateDisplay();
            } else { alert("Saldo insuficiente"); }
        }
        updateDisplay();
    </script>
</body>
</html>
