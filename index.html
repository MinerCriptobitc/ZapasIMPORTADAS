<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f5f5; }
    header { background:#222; color:#fff; padding:10px 20px; display:flex; align-items:center; justify-content:space-between; }
    header img { height:50px; }
    nav a { color:#fff; margin-left:15px; text-decoration:none; font-weight:bold; }
    .container { max-width:1200px; margin:20px auto; padding:0 20px; }
    .products { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:20px; }
    .product { background:#fff; padding:15px; border-radius:8px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    .product img { max-width:100%; border-radius:8px; }
    .product h3 { margin:10px 0; }
    .product p { color:#555; }
    .product a { display:inline-block; margin-top:10px; padding:10px 15px; background:#28a745; color:#fff; border-radius:5px; text-decoration:none; }
    footer { background:#222; color:#fff; padding:20px; text-align:center; }
    footer a { color:#fff; margin:0 10px; font-size:20px; text-decoration:none; }
  </style>
</head>
<body>

  <header>
    <img src="https://via.placeholder.com/150x50?text=LOGO" alt="Logo Tienda">
    <nav>
      <a href="#productos">Productos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <div class="container">
    <h1 id="productos">Nuestros Productos</h1>
    <div class="products">
      
      <div class="product">
        <img src="https://via.placeholder.com/250" alt="Producto 1">
        <h3>Producto 1</h3>
        <p>Descripción corta del producto.</p>
        <a href="https://www.paypal.com/paypalme/tuusuario/100" target="_blank">Comprar $100</a>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/250" alt="Producto 2">
        <h3>Producto 2</h3>
        <p>Descripción corta del producto.</p>
        <a href="https://www.paypal.com/paypalme/tuusuario/200" target="_blank">Comprar $200</a>
      </div>

    </div>
  </div>

  <footer id="contacto">
    <p>Contáctanos:</p>
    <a href="https://wa.me/5491234567890" target="_blank"><i class="fab fa-whatsapp"></i></a>
    <a href="https://www.facebook.com/tuusuario" target="_blank"><i class="fab fa-facebook"></i></a>
    <a href="https://www.instagram.com/tuusuario" target="_blank"><i class="fab fa-instagram"></i></a>
  </footer>

</body>
</html>
